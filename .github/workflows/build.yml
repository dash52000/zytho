name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk zytho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zytho-apk
          path: zytho.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Zytho 1.1.${{ github.run_number }}
          body: "APK à installer sur Android : télécharge zytho.apk ci-dessous."
          files: zytho.apk
          make_latest: true

      - name: Push build log on failure
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git config user.name "zytho-ci"
          git config user.email "zytho-ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf . -q
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
